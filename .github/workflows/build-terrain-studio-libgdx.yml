name: Build Terrain Studio Mini 3D V8 APK

on:
  push:
    branches: [ terrain-studio-libgdx ]
    paths:
      - 'projects/terrain-studio-libgdx/**'
      - '.github/workflows/build-terrain-studio-libgdx.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/terrain-studio-libgdx
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply V5 editor upgrade
        run: python3 tools/apply_v5.py

      - name: Apply V6 interaction fixes
        run: python3 tools/apply_v6.py

      - name: Apply V7 stable controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/apply_v7.py')
          s=p.read_text(encoding='utf-8')
          s=re.sub(
              r"a = must_replace\(a,\n'''    private LinearLayout\.LayoutParams toolLp\(\)\{LinearLayout\.LayoutParams lp=new LinearLayout\.LayoutParams\(dp\(50\),dp\(48\)\);lp\.setMargins\(0,dp\(2\),0,dp\(2\)\);return lp;\}''',\n'''    private LinearLayout\.LayoutParams toolLp\(\)\{LinearLayout\.LayoutParams lp=new LinearLayout\.LayoutParams\(dp\(48\),dp\(44\)\);lp\.setMargins\(0,dp\(2\),0,dp\(2\)\);return lp;\}''', 'compact tools'\)",
              "a = a.replace('dp(50),dp(48)', 'dp(48),dp(44)')",
              s,
              count=1
          )
          p.write_text(s,encoding='utf-8')
          PY
          python3 tools/apply_v7.py

      - name: Fix V7 Java labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/godnit/terrainstudio/gdx/BlenderActivityV4.java')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'toolButton\("([^"\n]*)\n([^"\n]*)"\)', lambda m: 'toolButton("'+m.group(1)+'\\n'+m.group(2)+'")', s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply V8 Blender gizmo
        run: python3 tools/apply_v8.py

      - name: Prepare signing key
        run: |
          base64 -d tools/v3/terrain-debug.keystore.b64 > app/terrain-debug.keystore
          test -s app/terrain-debug.keystore

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 15
          unzip -l "$APK" | grep -E 'classes.dex|libgdx.so|AndroidManifest.xml'

      - name: Collect APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TerrainStudio-Mini3D-v8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrainStudio-Mini3D-v8-APK
          path: projects/terrain-studio-libgdx/output/TerrainStudio-Mini3D-v8.apk
          if-no-files-found: error
          compression-level: 0
