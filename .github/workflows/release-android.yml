name: Release Android APK

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete application source
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/pva_c_* > project-source.zip
          unzip -o project-source.zip -d .
          test -f pubspec.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - run: python3 tool/generate_audio_assets.py
      - run: flutter create --platforms=android --org com.pianoviolin --project-name piano_violin_academy .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Configure production signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release --build-name "${GITHUB_REF_NAME#v}"

      - name: Name release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/piano-violin-academy-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/piano-violin-academy-${{ github.ref_name }}.apk
