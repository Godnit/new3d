name: Build Android APK

on:
  push:
    branches: [main, piano-violin-academy-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore complete application source
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/pva_c_* > project-source.zip
          unzip -o project-source.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Generate royalty-free audio assets
        run: python3 tool/generate_audio_assets.py

      - name: Generate missing Flutter platform files
        run: flutter create --platforms=android --org com.pianoviolin --project-name piano_violin_academy .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode signing key when configured
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Label fallback release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-development-signed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-violin-academy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-violin-academy-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release-development-signed.apk
          if-no-files-found: error
