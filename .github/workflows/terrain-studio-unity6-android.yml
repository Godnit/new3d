name: Terrain Studio Unity 6 Android

on:
  workflow_dispatch:
  push:
    branches:
      - terrain-studio-unity6
    paths:
      - 'projects/terrain-studio-unity/**'
      - '.github/workflows/terrain-studio-unity6-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v5
        with:
          targetPlatform: Android
          unityVersion: 6000.3.12f1
          projectPath: projects/terrain-studio-unity
          buildMethod: TerrainStudio.Editor.TerrainStudioBuild.BuildAndroid
          androidExportType: androidPackage
          versioning: None
          allowDirtyBuild: true
          runAsHostUser: true

      - name: Verify APK
        shell: bash
        run: |
          APK="projects/terrain-studio-unity/Build/TerrainStudio-Unity6.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrainStudio-Unity6-APK
          path: projects/terrain-studio-unity/Build/TerrainStudio-Unity6.apk
          if-no-files-found: error
          compression-level: 0
