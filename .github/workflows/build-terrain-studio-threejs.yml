name: Build Terrain Studio Three V11 APK

on:
  push:
    branches: [ terrain-studio-threejs-v11 ]
    paths:
      - 'projects/terrain-studio-threejs/**'
      - '.github/workflows/build-terrain-studio-threejs.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/terrain-studio-threejs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Apply V11 color compatibility fix
        run: python3 tools/apply-v11-colors.py
      - name: Bundle Three.js editor
        run: npm run build:web
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-36"
      - name: Stable signing key
        run: |
          base64 -d ../terrain-studio-libgdx/tools/v3/terrain-debug.keystore.b64 > android/app/terrain-debug.keystore
          test -s android/app/terrain-debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: projects/terrain-studio-threejs/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 12
          unzip -l "$APK" | grep -E 'classes.dex|assets/editor/app.js|assets/editor/index.html|AndroidManifest.xml'
      - name: Collect
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/TerrainStudio-Three-V11.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TerrainStudio-Three-V11-APK
          path: projects/terrain-studio-threejs/output/TerrainStudio-Three-V11.apk
          if-no-files-found: error
          compression-level: 0
