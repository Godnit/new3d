name: Piano Violin Cloud APK Build

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.event.issue.title == '[BUILD] Piano & Violin Academy APK'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish workflow run link
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Ubuntu build started: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout isolated application branch
        uses: actions/checkout@v4
        with:
          ref: piano-violin-academy-build

      - name: Verify direct application source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tool/generate_audio.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Generate standard Android project
        run: flutter create --platforms=android --org com.pianoviolin --project-name piano_violin_academy .

      - name: Generate original royalty-free audio assets
        run: python3 tool/generate_audio.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Label development-signed release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-development-signed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-violin-academy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-violin-academy-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release-development-signed.apk
          if-no-files-found: error

      - name: Publish final result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Ubuntu build finished with status **${result}**. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
