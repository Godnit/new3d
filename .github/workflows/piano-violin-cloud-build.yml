name: Piano Violin Cloud APK Build

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.event.issue.title == '[BUILD] Piano & Violin Academy APK'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish workflow run link
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Ubuntu build started: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout isolated application branch
        uses: actions/checkout@v4
        with:
          ref: piano-violin-academy-build

      - name: Verify direct application source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tool/generate_audio.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Generate standard Android project
        run: flutter create --platforms=android --org com.pianoviolin --project-name piano_violin_academy .

      - name: Generate original royalty-free audio assets
        run: python3 tool/generate_audio.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build unsigned release APK
        run: flutter build apk --release

      - name: Sign and verify installable release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "${ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "${BUILD_TOOLS}/zipalign"
          test -x "${BUILD_TOOLS}/apksigner"

          mkdir -p "${HOME}/.android"
          if [ ! -f "${HOME}/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          INPUT_APK="build/app/outputs/flutter-apk/app-release.apk"
          ALIGNED_APK="build/app/outputs/flutter-apk/app-release-aligned.apk"
          SIGNED_APK="build/app/outputs/flutter-apk/Piano-Violin-Academy-installable.apk"

          "${BUILD_TOOLS}/zipalign" -p -f 4 "${INPUT_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${HOME}/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${SIGNED_APK}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-violin-academy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload installable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-violin-academy-installable-apk
          path: build/app/outputs/flutter-apk/Piano-Violin-Academy-installable.apk
          if-no-files-found: error

      - name: Publish final result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Ubuntu build finished with status **${result}**. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
