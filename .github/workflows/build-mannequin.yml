name: Build Reference Mannequin

on:
  pull_request:
    paths:
      - 'mannequin_v03/**'
      - '.github/workflows/build-mannequin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Build model, source file and preview
        run: |
          mkdir -p build/mannequin_v03
          blender --background --python mannequin_v03/create_reference_mannequin_v03.py -- --output-dir build/mannequin_v03
          ls -lah build/mannequin_v03

      - name: Upload Blender model artifact
        uses: actions/upload-artifact@v4
        with:
          name: reference-mannequin-v03
          path: build/mannequin_v03/*
          if-no-files-found: error
