name: Build Reference Mannequin

on:
  pull_request:
    paths:
      - 'mannequin_v03/create_reference_mannequin_v03.py'
      - '.github/workflows/build-mannequin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Build model, source file and preview
        run: |
          rm -rf build/mannequin_v03 mannequin_v03/generated
          mkdir -p build/mannequin_v03 mannequin_v03/generated
          blender --background --python mannequin_v03/create_reference_mannequin_v03.py -- --output-dir build/mannequin_v03
          ls -lah build/mannequin_v03

      - name: Package and split generated files
        run: |
          tar -czf /tmp/reference_mannequin_v03_bundle.tar.gz -C build/mannequin_v03 .
          sha256sum /tmp/reference_mannequin_v03_bundle.tar.gz > mannequin_v03/generated/bundle.sha256
          base64 -w 0 /tmp/reference_mannequin_v03_bundle.tar.gz | split -b 70000 -d -a 3 - mannequin_v03/generated/bundle.b64.part-
          printf '%s\n' 'Decode with: cat bundle.b64.part-* | base64 -d > reference_mannequin_v03_bundle.tar.gz' > mannequin_v03/generated/DECODE.txt
          ls -lah mannequin_v03/generated

      - name: Commit generated bundle chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mannequin_v03/generated
          git commit -m 'Add generated Blender mannequin bundle [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
