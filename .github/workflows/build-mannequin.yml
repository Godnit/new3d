name: Build Reference Mannequin

on:
  pull_request:
    paths:
      - 'mannequin_v03/create_reference_mannequin_v03.py'
      - '.github/workflows/build-mannequin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Blender and export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libegl1 libgl1 libglx-mesa0
          blender --version
          python3 -c "import numpy; print(numpy.__version__)"

      - name: Refine proportions to match reference mannequin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mannequin_v03/create_reference_mannequin_v03.py')
          text = path.read_text()
          replacements = [
              ('MODEL_NAME = "reference_mannequin_v03"', 'MODEL_NAME = "reference_mannequin_v04"'),
              ("body_mat = make_material('Warm_Salmon_Body', (0.88, 0.39, 0.34, 1.0), 0.68)", "body_mat = make_material('Warm_Salmon_Body', (0.55, 0.15, 0.11, 1.0), 0.72)"),
              ("joint_mat = make_material('Muted_Rose_Joints', (0.62, 0.24, 0.22, 1.0), 0.72)", "joint_mat = make_material('Muted_Rose_Joints', (0.28, 0.055, 0.040, 1.0), 0.76)"),
              ("light_mat = make_material('Soft_Highlight', (0.95, 0.50, 0.44, 1.0), 0.65)", "light_mat = make_material('Soft_Highlight', (0.68, 0.22, 0.16, 1.0), 0.72)"),
              ("    'L_shoulder': (-0.38, 0.0, 1.75),", "    'L_shoulder': (-0.34, 0.0, 1.75),"),
              ("    'R_shoulder': (0.38, 0.0, 1.75),", "    'R_shoulder': (0.34, 0.0, 1.75),"),
              ("    'L_elbow': (-0.43, -0.005, 1.34),", "    'L_elbow': (-0.37, -0.005, 1.34),"),
              ("    'R_elbow': (0.43, -0.005, 1.34),", "    'R_elbow': (0.37, -0.005, 1.34),"),
              ("    'L_wrist': (-0.43, -0.015, 0.97),", "    'L_wrist': (-0.37, -0.015, 0.97),"),
              ("    'R_wrist': (0.43, -0.015, 0.97),", "    'R_wrist': (0.37, -0.015, 0.97),"),
              ("    'L_hand': (-0.43, -0.025, 0.77),", "    'L_hand': (-0.37, -0.025, 0.79),"),
              ("    'R_hand': (0.43, -0.025, 0.77),", "    'R_hand': (0.37, -0.025, 0.79),"),
              ("    'L_hip': (-0.18, 0.0, 0.92),", "    'L_hip': (-0.16, 0.0, 0.92),"),
              ("    'R_hip': (0.18, 0.0, 0.92),", "    'R_hip': (0.16, 0.0, 0.92),"),
              ("    'L_knee': (-0.18, 0.0, 0.42),", "    'L_knee': (-0.16, 0.0, 0.40),"),
              ("    'R_knee': (0.18, 0.0, 0.42),", "    'R_knee': (0.16, 0.0, 0.40),"),
              ("    'L_ankle': (-0.18, -0.01, 0.03),", "    'L_ankle': (-0.16, -0.01, -0.02),"),
              ("    'R_ankle': (0.18, -0.01, 0.03),", "    'R_ankle': (0.16, -0.01, -0.02),"),
              ("    (1.34, 0.14, 0.10),\n    (1.43, 0.22, 0.14),\n    (1.62, 0.33, 0.17),\n    (1.78, 0.42, 0.19),\n    (1.84, 0.36, 0.17),", "    (1.36, 0.12, 0.09),\n    (1.44, 0.20, 0.13),\n    (1.62, 0.29, 0.16),\n    (1.77, 0.37, 0.18),\n    (1.83, 0.32, 0.16),"),
              ("collar = add_uv_ellipsoid('Shoulder_Collar_Plate', (0, 0, 1.79), (0.43, 0.18, 0.055), light_mat)", "collar = add_uv_ellipsoid('Shoulder_Collar_Plate', (0, 0, 1.79), (0.36, 0.15, 0.035), light_mat)"),
              ("abdomen = add_uv_ellipsoid('Abdomen_Joint', (0, 0, 1.27), (0.18, 0.13, 0.20), joint_mat)", "abdomen = add_uv_ellipsoid('Abdomen_Joint', (0, 0, 1.27), (0.15, 0.11, 0.18), joint_mat)"),
              ("pelvis = add_uv_ellipsoid('Pelvis_Core', (0, 0, 1.01), (0.28, 0.17, 0.21), body_mat)", "pelvis = add_uv_ellipsoid('Pelvis_Core', (0, 0, 1.01), (0.23, 0.15, 0.18), body_mat)"),
              ("hip_guard = add_uv_ellipsoid(f'{side}_Hip_Guard', (0.20*sx, -0.005, 0.95), (0.16, 0.105, 0.075), light_mat)", "hip_guard = add_uv_ellipsoid(f'{side}_Hip_Guard', (0.17*sx, -0.005, 0.95), (0.13, 0.09, 0.055), body_mat)"),
              ("neck = add_uv_ellipsoid('Neck_Joint', (0, 0, 1.90), (0.07, 0.065, 0.095), joint_mat)", "neck = add_uv_ellipsoid('Neck_Joint', (0, 0, 1.90), (0.06, 0.055, 0.080), joint_mat)"),
              ("head = add_uv_ellipsoid('Featureless_Egg_Head', (0, 0, 2.10), (0.15, 0.125, 0.23), body_mat)", "head = add_uv_ellipsoid('Featureless_Egg_Head', (0, 0, 2.09), (0.14, 0.115, 0.205), body_mat)"),
              ("(0.105, 0.105, 0.105), joint_mat", "(0.090, 0.090, 0.090), joint_mat"),
              ("0.085, 0.060, body_mat", "0.075, 0.052, body_mat"),
              ("(0.067, 0.065, 0.062), joint_mat", "(0.058, 0.056, 0.055), joint_mat"),
              ("0.070, 0.045, body_mat", "0.060, 0.038, body_mat"),
              ("(0.045, 0.043, 0.044), joint_mat", "(0.038, 0.036, 0.038), joint_mat"),
              ("(0.066, 0.050, 0.115), body_mat", "(0.055, 0.043, 0.120), body_mat"),
              ("(0.030, 0.026, 0.070), body_mat", "(0.025, 0.022, 0.055), body_mat"),
              ("(0.105, 0.10, 0.105), joint_mat", "(0.090, 0.085, 0.090), joint_mat"),
              ("0.125, 0.085, body_mat", "0.105, 0.072, body_mat"),
              ("(0.090, 0.085, 0.080), joint_mat", "(0.075, 0.072, 0.070), joint_mat"),
              ("0.085, 0.052, body_mat", "0.072, 0.044, body_mat"),
              ("(0.052, 0.05, 0.045), joint_mat", "(0.044, 0.042, 0.040), joint_mat"),
              ("foot = add_uv_ellipsoid(f'{side}_Foot', (0.18*sx, -0.075, -0.02), (0.082, 0.155, 0.060), body_mat)", "foot = add_uv_ellipsoid(f'{side}_Foot', (0.16*sx, -0.085, -0.08), (0.070, 0.160, 0.050), body_mat)"),
              ("(0.18*sx,-0.16,-0.02)", "(0.16*sx,-0.17,-0.08)"),
              ("arm['model_version'] = 'R03'", "arm['model_version'] = 'R04'"),
              ("bpy.ops.mesh.primitive_plane_add(size=20, location=(0,0,-0.085))", "bpy.ops.mesh.primitive_plane_add(size=20, location=(0,0,-0.145))"),
              ("world.node_tree.nodes['Background'].inputs['Strength'].default_value = 0.75", "world.node_tree.nodes['Background'].inputs['Strength'].default_value = 0.45"),
              ("add_area('Key_Light', (-3.2,-4.0,5.2), 850, 4.0, (1.0,0.78,0.70))", "add_area('Key_Light', (-3.2,-4.0,5.2), 520, 4.0, (1.0,0.78,0.70))"),
              ("add_area('Fill_Light', (3.2,-2.0,3.0), 420, 3.5, (0.72,0.82,1.0))", "add_area('Fill_Light', (3.2,-2.0,3.0), 220, 3.5, (0.72,0.82,1.0))"),
              ("add_area('Rim_Light', (0,3.0,4.0), 500, 2.8, (1.0,0.70,0.62))", "add_area('Rim_Light', (0,3.0,4.0), 300, 2.8, (1.0,0.70,0.62))"),
              ("cam.location = (3.25, -6.2, 2.65)", "cam.location = (1.55, -6.8, 2.75)"),
              ("cam_data.lens = 64", "cam_data.lens = 70"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Build and capture Blender log
        run: |
          rm -rf build/mannequin_v03 mannequin_v03/generated
          mkdir -p build/mannequin_v03 mannequin_v03/generated
          set +e
          xvfb-run -a blender --background --python mannequin_v03/create_reference_mannequin_v03.py -- --output-dir build/mannequin_v03 > mannequin_v03/generated/blender_build.log 2>&1
          echo $? > mannequin_v03/generated/blender_exit_code.txt
          set -e
          ls -lah build/mannequin_v03 >> mannequin_v03/generated/blender_build.log 2>&1 || true

      - name: Package generated files when present
        run: |
          if compgen -G 'build/mannequin_v03/*' > /dev/null; then
            tar -czf /tmp/reference_mannequin_v04_bundle.tar.gz -C build/mannequin_v03 .
            sha256sum /tmp/reference_mannequin_v04_bundle.tar.gz > mannequin_v03/generated/bundle.sha256
            base64 -w 0 /tmp/reference_mannequin_v04_bundle.tar.gz | split -b 70000 -d -a 3 - mannequin_v03/generated/bundle.b64.part-
            printf '%s\n' 'Decode with: cat bundle.b64.part-* | base64 -d > reference_mannequin_v04_bundle.tar.gz' > mannequin_v03/generated/DECODE.txt
          else
            printf '%s\n' 'Blender produced no output files. See blender_build.log.' > mannequin_v03/generated/BUILD_ERROR.txt
            exit 1
          fi
          ls -lah mannequin_v03/generated

      - name: Upload generated Blender bundle
        uses: actions/upload-artifact@v4
        with:
          name: reference-mannequin-v04
          path: /tmp/reference_mannequin_v04_bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Commit diagnostics or generated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mannequin_v03/create_reference_mannequin_v03.py mannequin_v03/generated
          if ! git diff --cached --quiet; then
            git commit -m 'Refine mannequin proportions and colors [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
