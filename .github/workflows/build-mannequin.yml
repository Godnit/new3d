name: Build Reference Mannequin

on:
  pull_request:
    paths:
      - 'mannequin_v03/create_reference_mannequin_v03.py'
      - '.github/workflows/build-mannequin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Build and capture Blender log
        run: |
          rm -rf build/mannequin_v03 mannequin_v03/generated
          mkdir -p build/mannequin_v03 mannequin_v03/generated
          set +e
          blender --background --python mannequin_v03/create_reference_mannequin_v03.py -- --output-dir build/mannequin_v03 > mannequin_v03/generated/blender_build.log 2>&1
          echo $? > mannequin_v03/generated/blender_exit_code.txt
          set -e
          ls -lah build/mannequin_v03 >> mannequin_v03/generated/blender_build.log 2>&1 || true

      - name: Package generated files when present
        run: |
          if compgen -G 'build/mannequin_v03/*' > /dev/null; then
            tar -czf /tmp/reference_mannequin_v03_bundle.tar.gz -C build/mannequin_v03 .
            sha256sum /tmp/reference_mannequin_v03_bundle.tar.gz > mannequin_v03/generated/bundle.sha256
            base64 -w 0 /tmp/reference_mannequin_v03_bundle.tar.gz | split -b 70000 -d -a 3 - mannequin_v03/generated/bundle.b64.part-
            printf '%s\n' 'Decode with: cat bundle.b64.part-* | base64 -d > reference_mannequin_v03_bundle.tar.gz' > mannequin_v03/generated/DECODE.txt
          else
            printf '%s\n' 'Blender produced no output files. See blender_build.log.' > mannequin_v03/generated/BUILD_ERROR.txt
            exit 1
          fi
          ls -lah mannequin_v03/generated

      - name: Upload generated Blender bundle
        uses: actions/upload-artifact@v4
        with:
          name: reference-mannequin-v03
          path: /tmp/reference_mannequin_v03_bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Commit diagnostics or generated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mannequin_v03/create_reference_mannequin_v03.py mannequin_v03/generated
          if ! git diff --cached --quiet; then
            git commit -m 'Update Blender mannequin build results [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
