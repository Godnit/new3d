name: Build Task City Small APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'task-city/**'
      - '.github/workflows/task-city-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip wget xvfb imagemagick python3-pil libgl1 libpulse0

      - name: Download selected city and Arabic font
        run: |
          set -euxo pipefail
          rm -rf task-city/assets
          mkdir -p task-city/assets/user_city/textures task-city/assets/fonts
          BASE="https://threejsfundamentals.org/threejs/resources/models/cartoon_lowpoly_small_city_free_pack"
          wget -q -O task-city/assets/user_city/scene.gltf "$BASE/scene.gltf"
          wget -q -O task-city/assets/user_city/scene.bin "$BASE/scene.bin"
          for tex in \
            World_ap_baseColor.jpeg \
            World_ap.8_baseColor.jpeg \
            World_ap.9_baseColor.jpeg \
            World_ap.11_baseColor.jpeg \
            World_ap.15_baseColor.jpeg \
            World_ap.16_baseColor.jpeg \
            World_ap.17_baseColor.jpeg \
            World_ap.19_baseColor.jpeg; do
            wget -q -O "task-city/assets/user_city/textures/$tex" "$BASE/textures/$tex"
          done
          # Keep visual quality while avoiding unnecessarily large mobile textures.
          mogrify -resize '1024x1024>' -strip -quality 82 task-city/assets/user_city/textures/*.jpeg
          wget -q -O task-city/assets/fonts/NotoSansArabic-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf"
          test -s task-city/assets/user_city/scene.gltf
          test -s task-city/assets/user_city/scene.bin
          du -sh task-city/assets

      - name: Apply strict typing compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('task-city/main.gd')
          s = p.read_text()
          s = s.replace('var remain := max(0,int(item.deadline)-int(Time.get_unix_time_from_system()))', 'var remain: int = max(0, int(item.deadline) - int(Time.get_unix_time_from_system()))')
          p.write_text(s)
          PY

      - name: Install Godot 4.6.3 with Android templates
        run: |
          set -euxo pipefail
          wget -q -O /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          wget -q -O /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable" /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"
          godot --version

      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Task City,C=YE" -keyalg RSA -keysize 2048 -validity 10000

      - name: Import and smoke test
        working-directory: task-city
        run: |
          set -o pipefail
          timeout 15m godot --headless --editor --rendering-method gl_compatibility --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then exit 1; fi
          timeout 40s godot --headless --rendering-method gl_compatibility --quit-after 180 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then exit 1; fi
          grep -q "TASKCITY_READY" smoke.log
          grep -q "SKETCHFAB_CITY_READY" smoke.log

      - name: Render real portrait preview
        working-directory: task-city
        env:
          TASKCITY_CAPTURE: "1"
          TASKCITY_CAPTURE_PATH: ${{ github.workspace }}/task-city/build/TaskCity-Preview.png
        run: |
          mkdir -p build
          set +e
          xvfb-run -a timeout 35s godot --rendering-method gl_compatibility 2>&1 | tee visual.log
          set -e
          grep -q "TASKCITY_CAPTURED" visual.log
          test -s build/TaskCity-Preview.png
          identify build/TaskCity-Preview.png

      - name: Export compact signed Android APK
        working-directory: task-city
        run: |
          mkdir -p build
          godot --headless --rendering-method gl_compatibility --export-debug "Android" build/TaskCity-small.apk 2>&1 | tee export.log
          test -s build/TaskCity-small.apk
          unzip -t build/TaskCity-small.apk >/dev/null
          unzip -l build/TaskCity-small.apk | tee build/apk-files.txt
          grep -q 'lib/armeabi-v7a/libgodot_android.so' build/apk-files.txt
          if grep -q 'lib/arm64-v8a/libgodot_android.so' build/apk-files.txt; then
            echo 'Unexpected ARM64 library found; APK is not compact.'
            exit 1
          fi
          BYTES=$(stat -c '%s' build/TaskCity-small.apk)
          echo "APK bytes: $BYTES"
          # Keep this test build under 40 MiB.
          test "$BYTES" -lt 41943040
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging build/TaskCity-small.apk | tee build/android-info.txt
          python3 - <<'PY'
          import re
          text=open('build/android-info.txt', encoding='utf-8').read()
          m=re.search(r"sdkVersion:'(\d+)'", text)
          assert m, 'Could not determine minSdk'
          sdk=int(m.group(1))
          print('minSdk', sdk)
          assert sdk <= 27, f'minSdk {sdk} would not support Android 8.1/API 27'
          PY
          keytool -printcert -jarfile build/TaskCity-small.apk | tee build/signature.txt
          sha256sum build/TaskCity-small.apk | tee build/SHA256SUMS.txt

      - name: Upload compact APK and preview
        uses: actions/upload-artifact@v4
        with:
          name: TaskCity-Small-Android8
          path: |
            task-city/build/TaskCity-small.apk
            task-city/build/TaskCity-Preview.png
            task-city/build/SHA256SUMS.txt
            task-city/build/signature.txt
            task-city/build/android-info.txt
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TaskCity-Small-Diagnostics
          path: |
            task-city/import.log
            task-city/smoke.log
            task-city/visual.log
            task-city/export.log
            task-city/build/apk-files.txt
            task-city/build/android-info.txt
          if-no-files-found: ignore
          retention-days: 7
