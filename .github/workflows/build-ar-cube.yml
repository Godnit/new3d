name: Build AR Cube APK

on:
  push:
    branches:
      - ar-cube-real
    paths:
      - "ar-cube-app/**"
      - ".github/workflows/build-ar-cube.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build debug APK
        working-directory: ar-cube-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp ar-cube-app/app/build/outputs/apk/debug/app-debug.apk out/AR-Cube-v1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Cube-v1-APK
          path: out/AR-Cube-v1-debug.apk
          if-no-files-found: error

      - name: Publish APK to branch
        run: |
          mkdir -p apk-output
          cp out/AR-Cube-v1-debug.apk apk-output/AR-Cube-v1-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-output/AR-Cube-v1-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "Build AR Cube v1 APK"
            git push origin HEAD:ar-cube-real
          fi
