<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Terrain Studio 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202328;color:#e9edf2;font-family:Arial,sans-serif}
button,input{font:inherit}.app{position:fixed;inset:0;direction:ltr}.viewport{position:absolute;inset:42px 0 0 0;touch-action:none}
.top{position:absolute;z-index:20;top:0;left:0;right:0;height:42px;background:#17191def;border-bottom:1px solid #34383e;display:flex;align-items:center;gap:5px;padding:4px 7px;direction:ltr}
.brand{font-weight:700;font-size:13px;padding:0 7px;color:#f3f5f8;white-space:nowrap}.sel{min-width:92px;max-width:155px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#bfc7d0;font-size:11px}
.top button,.tool,.mini,.panelBtn{border:1px solid #41464e;background:#2d3137;color:#e9edf2;border-radius:7px;height:32px;padding:0 8px}
.top button.active,.tool.active,.shadeBar button.active{background:#285f86;border-color:#4ba8ec}
.left{position:absolute;z-index:30;left:7px;top:50px;bottom:8px;width:50px;display:flex;flex-direction:column;gap:5px;direction:ltr;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:6px}
.left::-webkit-scrollbar{display:none}.tool{flex:0 0 46px;width:48px;height:46px;padding:0;font-size:20px;display:flex;align-items:center;justify-content:center}
.addMenu{position:absolute;z-index:35;left:62px;top:50px;width:174px;max-height:calc(100% - 60px);overflow-y:auto;padding:7px;background:#1c2025f7;border:1px solid #41464e;border-radius:9px;display:none;direction:rtl}
.addMenu.open{display:block}.addMenu button{width:100%;height:35px;margin:2px 0;background:#30353c;color:#fff;border:1px solid #454b54;border-radius:6px;text-align:right;padding:0 10px}
.properties{position:absolute;z-index:26;right:8px;top:50px;width:238px;max-height:calc(100% - 60px);display:none;background:#1b1e22f2;border:1px solid #3b4047;border-radius:9px;overflow:hidden;direction:rtl;box-shadow:0 8px 30px #0008}
.properties.open{display:block}.panelHead{height:36px;padding:0 8px;background:#262a30;border-bottom:1px solid #3b4047;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.panelHead button{width:30px;height:27px;border:1px solid #444a52;border-radius:5px;background:#30353c;color:#fff}.panelScroll{max-height:calc(100vh - 98px);overflow:auto;padding:7px}
.section{border:1px solid #343941;border-radius:7px;margin-bottom:7px;overflow:hidden;background:#20242a}.section.disabled{opacity:.48;pointer-events:none}.sectionTitle{height:28px;display:flex;align-items:center;padding:0 8px;background:#282d33;color:#dce4ec;font-size:10px;font-weight:700}
.sectionBody{padding:6px}.nameRow{display:grid;grid-template-columns:52px 1fr;gap:5px;align-items:center;direction:ltr}.nameRow label,.row label,.sliderRow label{font-size:10px;color:#aeb7c1;text-align:left}
.nameRow input,.row input{width:100%;height:27px;background:#292e34;color:#eef2f6;border:1px solid #41464e;border-radius:4px;padding:0 5px;font-size:10px}
.row{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:4px;align-items:center;margin:4px 0;direction:ltr}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px}.swatch{height:27px;border-radius:5px;border:2px solid #ffffff55;padding:0}.colorRow{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center}.colorRow input[type=color]{width:100%;height:30px;border:1px solid #454b54;border-radius:5px;background:#292e34;padding:2px}
.sliderRow{display:grid;grid-template-columns:72px 1fr;gap:6px;align-items:center;margin:5px 0;direction:ltr}.sliderRow input{width:100%}
.outliner{position:absolute;z-index:25;right:8px;bottom:8px;width:225px;max-height:46%;display:none;background:#1b1e22f2;border:1px solid #3b4047;border-radius:9px;overflow:hidden;direction:rtl;box-shadow:0 8px 30px #0007}
.outliner.open{display:block}.outlinerList{max-height:calc(46vh - 36px);overflow:auto}.outlinerRow{height:34px;display:grid;grid-template-columns:1fr 34px 34px;border-bottom:1px solid #30353b;background:#20242a;direction:ltr}.outlinerRow.active{background:#285f86}
.outlinerName,.outlinerIcon{border:0;background:transparent;color:#dce2e8}.outlinerName{text-align:right;padding:0 8px;direction:rtl}.outlinerIcon{font-size:14px;padding:0}
.viewNav{position:absolute;z-index:23;right:8px;top:50px;display:grid;grid-template-columns:repeat(4,32px);gap:3px;padding:4px;background:#171a1ec9;border:1px solid #3a3f46;border-radius:8px;direction:ltr}
.viewNav button{height:29px;border:1px solid #41464e;background:#2d3137;color:#dce4ec;border-radius:5px;font-size:10px;padding:0}.viewNav button.iso{color:#76c8ff}
.shadeBar{position:absolute;z-index:23;right:8px;top:122px;display:flex;gap:3px;padding:4px;background:#171a1ec9;border:1px solid #3a3f46;border-radius:8px;direction:ltr}
.shadeBar button{height:29px;min-width:36px;border:1px solid #41464e;background:#2d3137;color:#dce4ec;border-radius:5px;font-size:10px;padding:0 7px}.file{display:none}
@media(max-width:720px){.brand{display:none}.sel{max-width:112px;min-width:72px}.top button{padding:0 6px}.properties{width:220px}.outliner{width:210px}.viewNav{grid-template-columns:repeat(4,29px)}.shadeBar button{min-width:32px;padding:0 5px}}
</style>
</head>
<body>
<div class="app">
  <div id="viewport" class="viewport"></div>
  <div class="top">
    <div class="brand">Terrain Studio 3D</div>
    <button id="newBtn">جديد</button>
    <button id="focusBtn" title="تركيز على المحدد">◎</button>
    <button id="spaceBtn">Global</button>
    <button id="snapBtn">Snap</button>
    <button id="propertiesBtn" title="الخصائص">▤</button>
    <button id="outlinerBtn" title="Outliner">☰</button>
    <div id="selectionName" class="sel">لا يوجد تحديد</div>
    <div id="modeName" class="sel">تحريك</div>
  </div>
  <div class="left">
    <button id="addBtn" class="tool" title="إضافة">＋</button>
    <button class="tool active" data-mode="translate" title="تحريك">↔</button>
    <button class="tool" data-mode="rotate" title="تدوير">⟳</button>
    <button class="tool" data-mode="scale" title="حجم">⤢</button>
    <button id="duplicateBtn" class="tool" title="نسخ">⧉</button>
    <button id="deleteBtn" class="tool" title="حذف">⌫</button>
    <button id="gridBtn" class="tool active" title="إظهار أو إخفاء الشبكة">▦</button>
    <button id="sunVisibleBtn" class="tool active" title="إظهار أو إخفاء الشمس">☀</button>
    <button id="shadowsBtn" class="tool active" title="الظلال">◐</button>
  </div>
  <div id="addMenu" class="addMenu">
    <button data-add="Cube">■ مكعب</button>
    <button data-add="Sphere">● كرة</button>
    <button data-add="Cylinder">▥ أسطوانة</button>
    <button data-add="Cone">▲ مخروط</button>
    <button data-add="Pyramid">◆ هرم</button>
    <button data-add="Torus">◎ حلقة</button>
    <button data-add="Icosphere">⬢ Icosphere</button>
    <button data-add="Plane">▭ سطح</button>
    <button id="importBtn">⇩ استيراد GLB / GLTF</button>
  </div>
  <div id="properties" class="properties">
    <div class="panelHead"><span>الخصائص</span><button id="propertiesClose">×</button></div>
    <div class="panelScroll">
      <div id="objectSection" class="section disabled">
        <div class="sectionTitle">Object</div>
        <div class="sectionBody">
          <div class="nameRow"><label>Name</label><input id="nameInput" type="text"></div>
          <div class="row"><label>Location</label><input id="px" inputmode="decimal"><input id="py" inputmode="decimal"><input id="pz" inputmode="decimal"></div>
          <div class="row"><label>Rotation</label><input id="rx" inputmode="decimal"><input id="ry" inputmode="decimal"><input id="rz" inputmode="decimal"></div>
          <div class="row"><label>Scale</label><input id="sx" inputmode="decimal"><input id="sy" inputmode="decimal"><input id="sz" inputmode="decimal"></div>
        </div>
      </div>
      <div id="materialSection" class="section disabled">
        <div class="sectionTitle">Material</div>
        <div class="sectionBody">
          <div class="swatches">
            <button class="swatch" data-color="#4f8fe8" style="background:#4f8fe8"></button><button class="swatch" data-color="#65c982" style="background:#65c982"></button><button class="swatch" data-color="#e3ad57" style="background:#e3ad57"></button><button class="swatch" data-color="#e97855" style="background:#e97855"></button><button class="swatch" data-color="#a875e8" style="background:#a875e8"></button><button class="swatch" data-color="#d9dde3" style="background:#d9dde3"></button>
          </div>
          <div class="colorRow"><label>اللون</label><input id="colorPicker" type="color" value="#4f8fe8"></div>
          <div class="sliderRow"><label>Roughness</label><input id="roughnessInput" type="range" min="0" max="1" step="0.01" value="0.56"></div>
          <div class="sliderRow"><label>Metallic</label><input id="metalnessInput" type="range" min="0" max="1" step="0.01" value="0.05"></div>
        </div>
      </div>
      <div class="section">
        <div class="sectionTitle">World & Light</div>
        <div class="sectionBody">
          <div class="sliderRow"><label>Ambient</label><input id="ambientInput" type="range" min="0" max="3" step="0.05" value="1.0"></div>
          <div class="sliderRow"><label>Sun</label><input id="sunInput" type="range" min="0" max="6" step="0.05" value="2.8"></div>
          <div class="colorRow"><label>الخلفية</label><input id="backgroundInput" type="color" value="#202328"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="viewNav">
    <button class="iso" data-view="iso">ISO</button><button data-view="top">TOP</button><button data-view="front">FR</button><button data-view="right">R</button><button data-view="back">BK</button><button data-view="left">L</button><button data-view="bottom">BT</button>
  </div>
  <div class="shadeBar">
    <button data-shading="solid">Solid</button><button class="active" data-shading="material">Mat</button><button data-shading="wire">Wire</button>
  </div>
  <div id="outliner" class="outliner"><div class="panelHead"><span>Outliner</span></div><div id="outlinerList" class="outlinerList"></div></div>
  <input id="fileInput" class="file" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" />
</div>
<script src="app.js"></script>
</body>
</html>
