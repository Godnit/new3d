plugins {
    id 'com.android.application'
}

android {
    namespace 'com.godnit.terrainstudio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.godnit.terrainstudio.nativegl'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1-native'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
